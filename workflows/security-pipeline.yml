name: 🛡️ Security Pipeline

on:
  push:
    branches: [main, develop]
  pull_request:
    branches: [main]
  schedule:
    # Run every Monday at 9 AM UTC — weekly security scan
    - cron: "0 9 * * 1"

jobs:
  # ────────────────────────────────────────────────────────
  # Job 1: Dependency vulnerability audit
  # ────────────────────────────────────────────────────────
  dependency-audit:
    name: 🔍 Dependency Vulnerability Scan
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run npm audit (critical + high only)
        run: npm audit --audit-level=high

      - name: Run custom vulnerability scanner
        run: node security/vuln-scanner.js
        env:
          DISCORD_WEBHOOK_URL: ${{ secrets.DISCORD_WEBHOOK_URL }}
          SLACK_WEBHOOK_URL:   ${{ secrets.SLACK_WEBHOOK_URL }}

  # ────────────────────────────────────────────────────────
  # Job 2: Static code analysis (CodeQL)
  # ────────────────────────────────────────────────────────
  codeql-analysis:
    name: 🔬 CodeQL Security Analysis
    runs-on: ubuntu-latest
    permissions:
      security-events: write
      actions: read
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Initialize CodeQL
        uses: github/codeql-action/init@v3
        with:
          languages: javascript

      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v3
        with:
          category: "/language:javascript"

  # ────────────────────────────────────────────────────────
  # Job 3: Secret scanning — catch leaked API keys
  # ────────────────────────────────────────────────────────
  secret-scan:
    name: 🔑 Secret Detection (TruffleHog)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run TruffleHog
        uses: trufflesecurity/trufflehog@main
        with:
          path: ./
          base: ${{ github.event.repository.default_branch }}
          head: HEAD
          extra_args: --debug --only-verified

  # ────────────────────────────────────────────────────────
  # Job 4: OWASP Dependency-Check (deep CVE scan)
  # ────────────────────────────────────────────────────────
  owasp-check:
    name: 🛡️ OWASP Dependency-Check
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Run OWASP Dependency-Check
        uses: dependency-check/Dependency-Check_Action@main
        with:
          project: "absall-security-suite"
          path: "."
          format: "HTML"
          args: "--failOnCVSS 7 --enableRetired"

      - name: Upload OWASP report
        uses: actions/upload-artifact@v4
        with:
          name: OWASP-Dependency-Report
          path: reports/

  # ────────────────────────────────────────────────────────
  # Job 5: Semgrep SAST — rule-based security linting
  #         NEW in v3.0: catches hardcoded creds, unsafe regex,
  #         prototype pollution, and more using OWASP rule packs
  # ────────────────────────────────────────────────────────
  semgrep:
    name: 🧪 Semgrep SAST
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v4

      - name: Run Semgrep (OWASP + Node.js security rules)
        run: |
          semgrep \
            --config "p/owasp-top-ten" \
            --config "p/nodejs" \
            --config "p/secrets" \
            --error \
            --json \
            --output semgrep-results.json \
            . || true

      - name: Upload Semgrep results
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-results
          path: semgrep-results.json

  # ────────────────────────────────────────────────────────
  # Job 6: Build + smoke test
  # ────────────────────────────────────────────────────────
  build-test:
    name: 🔨 Build & Smoke Test
    runs-on: ubuntu-latest
    needs: [dependency-audit]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Run unit tests
        run: npm test --if-present
        env:
          NODE_ENV: test

      - name: Build React frontend
        run: npm run build --if-present
        env:
          NODE_ENV: production
          CI: false
